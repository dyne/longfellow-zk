name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  posix-x86:
    name: Build & Test on POSIX x86
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: clang, cxx: clang++ }
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    - name: short SHA of current commit
      id: sha
      run: echo "git_sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    - uses: hendrikmuhs/ccache-action@v1.2
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: "build-essential g++ clang make jq xxd"
    - name: Import upstream longfellow-zk
      run: |
        bash scripts/import_upstream.sh vendor/longfellow-zk
    - name: Build project with ${{ matrix.compiler.cxx }}
      run: |
        make clean
        make -j$(nproc) CC="ccache ${{ matrix.compiler.cc }}" CXX="ccache ${{ matrix.compiler.cxx }}"
    - name: Verify binaries
      run: |
        ls -lh longfellow-zk
        file longfellow-zk
        ldd longfellow-zk || true
    - name: Run CLI help
      run: |
        ./longfellow-zk --help
    - name: List ZK specs
      run: |
        ./longfellow-zk circuit_gen --zkspec list
    - name: Run tests
      run: |
        cd test
        ./bats/bin/bats mdoc.bats
    - name: Pack build results
      run: |
        bash scripts/pack_release.sh ${{ github.job }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.job }}
        path: |
          longfellow-zk_${{ github.job }}.zip
    outputs:
       git_sha_short: ${{ steps.sha.outputs.git_sha_short }}

  wasm-wasi:
    name: Build & Test on WASM WASI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    - uses: hendrikmuhs/ccache-action@v1.2
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: "build-essential make jq xxd g++"
    - name: Install WASI SDK
      uses: konsumer/install-wasi-sdk@v1
      with:
        version: "29"   # specify WASI SDK version
        install-path: "/opt/wasi-sdk"
        add-to-path: true
    - name: Import upstream longfellow-zk
      run: |
        bash scripts/import_upstream.sh vendor/longfellow-zk
    - name: Build project
      run: |
        make clean
        make -j$(nproc) wasm CC="ccache /opt/wasi-sdk/bin/clang" CXX="ccache /opt/wasi-sdk/bin/clang++"
    - name: Pack build results
      run: |
        bash scripts/pack_release.sh ${{ github.job }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.job }}
        path: |
          longfellow-zk_${{ github.job }}.zip

  apple-osx:
    name: Build & Test on Apple OSX 15 ARM64
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive
    - uses: hendrikmuhs/ccache-action@v1.2
    - name: Install latest Bash via Homebrew
      run: |
        brew install bash
        echo "/opt/homebrew/bin/bash" >> $GITHUB_PATH
    - name: Import upstream longfellow-zk
      run: |
        bash scripts/import_upstream.sh vendor/longfellow-zk
    - name: Build project
      run: |
        make clean
        make -j$(nproc) osx-arm64 CC="ccache clang" CXX="ccache clang++"
    - name: Verify binaries
      run: |
        ls -lh longfellow-zk
        file longfellow-zk
        otool -L longfellow-zk || true
    - name: Run CLI help
      run: |
        ./longfellow-zk --help
    - name: List ZK specs
      run: |
        ./longfellow-zk circuit_gen --zkspec list
    - name: Run tests
      run: |
        cd test
        ./bats/bin/bats mdoc.bats
    - name: Pack build results
      run: |
        bash scripts/pack_release.sh ${{ github.job }}
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.job }}
        path: |
          longfellow-zk_${{ github.job }}.zip

  draft-binary-release:
    name: 📦 Pack
    needs: [posix-x86, wasm-wasi, apple-osx]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: download binary artifacts
      uses: actions/download-artifact@v6
      with:
        path: |
          release
    - name: show directory structure
      run: tree
    - name: list all files to release
      run: |
        find release -type f
    - name: release all binary artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/posix-x86/*
          release/wasm-wasi/*
          release/apple-osx/*
        tag_name: ${{ needs.posix-x86.outputs.git_sha_short }}
        draft: false
        prerelease: false
        generate_release_notes: true
