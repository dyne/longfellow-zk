name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  ci-scope:
    name: Determine CI scope
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.scope.outputs.run_tests }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
    - name: Detect code changes
      id: scope
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        PUSH_HEAD_SHA: ${{ github.sha }}
      run: |
        set -Eeuo pipefail

        run_tests=true
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          base_sha="$PR_BASE_SHA"
          head_sha="$PR_HEAD_SHA"
        elif [[ "$EVENT_NAME" == "push" &&
                ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
          base_sha="$PUSH_BEFORE_SHA"
          head_sha="$PUSH_HEAD_SHA"
        else
          # Manual runs and unusual pushes fail open to the full CI matrix.
          base_sha=""
          head_sha=""
        fi

        if [[ -n "$base_sha" && -n "$head_sha" ]]; then
          git rev-parse --verify "${base_sha}^{commit}" >/dev/null
          git rev-parse --verify "${head_sha}^{commit}" >/dev/null
          run_tests=false
          while IFS= read -r -d '' path; do
            if [[ "$path" == *.md ]]; then
              continue
            fi

            base_mode="$(git ls-tree "$base_sha" -- "$path" | awk '{print $1}')"
            head_mode="$(git ls-tree "$head_sha" -- "$path" | awk '{print $1}')"
            if [[ "$base_mode" == "160000" || "$head_mode" == "160000" ]]; then
              continue
            fi

            run_tests=true
            break
          done < <(git diff --name-only --no-renames -z "$base_sha" "$head_sha")
        fi

        printf 'run_tests=%s\n' "$run_tests" | tee -a "$GITHUB_OUTPUT"

  posix-x86:
    name: Build & Test on POSIX x86
    needs: [ci-scope]
    if: needs.ci-scope.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { id: gcc, cc: gcc, cxx: g++ }
          - { id: clang, cc: clang, cxx: clang++ }
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: short SHA of current commit
      id: sha
      run: echo "git_sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: "build-essential g++ clang make jq xxd"
    - name: Build project with ${{ matrix.compiler.cxx }}
      run: |
        cmake --preset release -DCMAKE_CXX_COMPILER=${{ matrix.compiler.cxx }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build --preset release --parallel
        ctest --preset release
    - name: Verify installed package consumers
      run: |
        CC=${{ matrix.compiler.cc }} CXX=${{ matrix.compiler.cxx }} \
          LONGFELLOW_ZK_PACKAGE_OUTPUT_DIR=build/qualified-packages \
          bash scripts/ci-installed-package.sh
    - name: Pack build results
      run: |
        bash scripts/pack_release.sh ${{ github.job }}-${{ matrix.compiler.id }}
    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ github.job }}-${{ matrix.compiler.id }}
        path: |
          longfellow-zk_${{ github.job }}-${{ matrix.compiler.id }}.tar.gz
          longfellow-zk_${{ github.job }}-${{ matrix.compiler.id }}.tar.gz.sha256
          build/qualified-packages/metrics/*_bip340_metrics.csv
    outputs:
       git_sha_short: ${{ steps.sha.outputs.git_sha_short }}

  wasm-wasi:
    name: Build & Test on WASM WASI
    needs: [ci-scope]
    if: needs.ci-scope.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        submodules: recursive
    - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
    - name: Cache APT packages
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: "build-essential make jq xxd g++"
    - name: Install WASI SDK
      uses: konsumer/install-wasi-sdk@d728b7abb7ef7db1610039d9798a8270e23f56f8 # v1.0.0
      with:
        version: "33"   # specify WASI SDK version
        install-path: "/opt/wasi-sdk"
        add-to-path: true
    - name: Build project
      run: |
        WASI_SDK_PATH=/opt/wasi-sdk cmake --preset wasi
        cmake --build --preset wasi --parallel
        cmake --install build/wasi --prefix build/wasi-prefix
        WASI_SDK_PATH=/opt/wasi-sdk cmake \
          -S projects/ecdsa \
          -B build/wasi-ecdsa \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/wasi.cmake" \
          -DCMAKE_PREFIX_PATH="$PWD/build/wasi-prefix" \
          -DLONGFELLOW_ZK_TARGET=LongfellowZK::static \
          -DBUILD_TESTING=ON
        cmake --build build/wasi-ecdsa --target ecdsa-wasi-verify-smoke --parallel
    - name: Run WASI ECDSA verifier smoke
      run: |
        node test/wasi_smoke.mjs \
          build/wasi/longfellow-zk-wasi-smoke.wasm \
          build/wasi-ecdsa/ecdsa-wasi-verify-smoke.wasm
    - name: Pack build results
      run: |
        LONGFELLOW_ZK_BUILD_DIR=build/wasi bash scripts/pack_release.sh ${{ github.job }}
    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ github.job }}
        path: |
          longfellow-zk_${{ github.job }}.tar.gz
          longfellow-zk_${{ github.job }}.tar.gz.sha256

  apple-osx:
    name: Build & Test on Apple OSX 15 ARM64
    needs: [ci-scope]
    if: needs.ci-scope.outputs.run_tests == 'true'
    runs-on: macos-15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        submodules: recursive
    - uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
    - name: Install latest Bash via Homebrew
      run: |
        brew install bash
        echo "/opt/homebrew/bin" >> $GITHUB_PATH
    - name: Build project
      run: |
        cmake --preset release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build --preset release --parallel
        ctest --preset release
    - name: Verify installed package consumers
      run: |
        LONGFELLOW_ZK_PACKAGE_OUTPUT_DIR=build/qualified-packages \
          bash scripts/ci-installed-package.sh
    - name: Pack build results
      run: |
        bash scripts/pack_release.sh ${{ github.job }}
    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ github.job }}
        path: |
          longfellow-zk_${{ github.job }}.tar.gz
          longfellow-zk_${{ github.job }}.tar.gz.sha256
          build/qualified-packages/metrics/*_bip340_metrics.csv

  bip340-metrics:
    name: Render BIP340 metrics
    needs: [posix-x86, wasm-wasi, apple-osx]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install metrics tooling
      run: |
        sudo apt-get update
        sudo apt-get install -y gnuplot-nox
    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: |
          release
    - name: Render BIP340 metrics
      run: |
        mkdir -p release-metrics
        bash scripts/aggregate_bip340_metrics.sh \
          release \
          release-metrics \
          "${{ needs.posix-x86.outputs.git_sha_short }}" \
          "${{ github.repository }}"
    - name: Upload BIP340 metrics artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: bip340-metrics
        path: |
          release-metrics/longfellow-zk_bip340_metrics.csv
          release-metrics/longfellow-zk_bip340_metrics.png
          release-metrics/bip340_metrics_release.md

  draft-binary-release:
    name: 📦 Pack
    needs: [posix-x86, wasm-wasi, apple-osx, bip340-metrics]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - name: download binary artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: |
          release
    - name: show directory structure
      run: find release -maxdepth 3 -print
    - name: list all files to release
      run: |
        find release -type f
    - name: release all binary artifacts
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
      with:
        files: |
          release/posix-x86-*/*
          release/wasm-wasi/*
          release/apple-osx/*
          release/bip340-metrics/longfellow-zk_bip340_metrics.csv
          release/bip340-metrics/longfellow-zk_bip340_metrics.png
        tag_name: ${{ needs.posix-x86.outputs.git_sha_short }}
        draft: false
        prerelease: false
        generate_release_notes: true
        body_path: release/bip340-metrics/bip340_metrics_release.md
